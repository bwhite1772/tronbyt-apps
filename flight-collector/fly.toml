# Rename this app and set primary_region to match your existing Tronbyt
# Fly app before deploying: `fly launch --no-deploy` will create/overwrite
# this file interactively if you'd rather start from scratch.
app = "overhead-flights-collector"
primary_region = "iad"

[build]

[env]
  RADIUS_NM = "15"
  POLL_INTERVAL_SECONDS = "15"
  STALE_AFTER_SECONDS = "90"
  DB_PATH = "/data/flights.db"
  FR24_FALLBACK_MIN_INTERVAL_SECONDS = "60"

# LAT, LON, and (optionally) FR24_API_KEY are set via `fly secrets set`
# instead of here, since fly.toml is checked into git: LAT/LON are your
# home location, and FR24_API_KEY is a credential. FR24_API_KEY is
# optional — omit it to run on airplanes.live alone. When set, FR24 is
# only called as a fallback on polls where airplanes.live sees nothing in
# range, throttled to at most one call per FR24_FALLBACK_MIN_INTERVAL_SECONDS.

[mounts]
  source = "flight_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
